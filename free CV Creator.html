<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVBuilder Pro - Free 100+ CV Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{ --blue:#1e3a5f; --bg:#f4f6fb; }
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:var(--bg);display:flex;flex-direction:column;height:100vh}
header{background:var(--blue);color:white;padding:12px 3%;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px} header h1 span{color:#4fc3f7}
.header-actions button{padding:8px 16px;border:none;border-radius:6px;font-weight:700;cursor:pointer;margin-left:8px}
.btn-preview{background:white;color:var(--blue)} .btn-pdf{background:#4fc3f7;color:#000}
.main{display:flex;flex:1;overflow:hidden}
.left{width:380px;background:white;overflow-y:auto;padding:15px;border-right:1px solid #ddd}
.right{flex:1;overflow-y:auto;background:#e8ecf3;padding:20px;display:flex;flex-direction:column;align-items:center}
.tabs{display:flex;gap:5px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--blue);background:white;border-radius:6px;cursor:pointer;font-weight:600}
.tabs button.active{background:var(--blue);color:white}
.section{margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #eee}
.section h3{font-size:14px;color:var(--blue);margin-bottom:8px;text-transform:uppercase}
.left input, .left textarea, .left select{width:100%;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:5px;font-size:13px}
.row{display:flex;gap:6px}
.add-btn{background:#e3f2fd;color:var(--blue);border:none;padding:6px 10px;border-radius:5px;cursor:pointer;font-size:12px;margin-top:6px;font-weight:700}
.template-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:220px;overflow-y:auto}
.tpl{height:70px;border:2px solid #ddd;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;background:white}
.tpl.active{border-color:var(--blue);background:var(--blue);color:white}
/* CV PREVIEW STYLES */
.cv-page{width:794px;min-height:1123px;background:white;box-shadow:0 0 20px rgba(0,0,0,0.15);display:flex;overflow:hidden}
.cv-sidebar{width:32%;padding:20px;background:var(--side-bg, #1e3a5f);color:white}
.cv-main{width:68%;padding:25px}
.cv-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid white;margin:0 auto 15px;display:block;background:#ccc}
.cv-sidebar h4{font-size:12px;margin:15px 0 6px;border-bottom:1px solid rgba(255,255,255,0.5);padding-bottom:4px}
.cv-sidebar p, .cv-sidebar li{font-size:11px;line-height:1.5}
.cv-main h1{font-size:28px;color:var(--main-color, #1e3a5f)}
.cv-main h2{font-size:13px;color:var(--main-color, #1e3a5f);margin:18px 0 6px;border-bottom:1.5px solid var(--main-color, #1e3a5f);padding-bottom:3px;text-transform:uppercase}
.cv-main p, .cv-main li{font-size:11.5px;line-height:1.5}
.dot{width:8px;height:8px;background:var(--main-color);border-radius:50%;display:inline-block;margin-right:6px}
</style>
</head>
<body>

<header>
<h1>CVBuilder <span>Pro</span> - 100 Templates Free</h1>
<div class="header-actions">
<button class="btn-preview" onclick="updatePreview()">Refresh</button>
<button class="btn-pdf" onclick="downloadPDF()">Download PDF</button>
</div>
</header>

<div class="main">
<div class="left">
<div class="tabs">
<button class="active" onclick="setUserType(this,'fresher')">Fresher</button>
<button onclick="setUserType(this,'experienced')">Experienced</button>
<button onclick="setUserType(this,'switcher')">Career Switch</button>
</div>

<div class="section">
<h3>Choose Template (100)</h3>
<div class="template-grid" id="tplGrid"></div>
<p style="font-size:11px;color:#666;margin-top:6px">100 templates = 20 layouts x 5 colors. Click any number.</p>
</div>

<div class="section">
<h3>Personal Info</h3>
<input id="name" placeholder="Full Name" value="Amit Kumar Das" oninput="updatePreview()">
<input id="role" placeholder="Professional Title" value="Commerce Graduate | Computer Professional" oninput="updatePreview()">
<input id="email" placeholder="Email" value="amitkumardas8093@gmail.com" oninput="updatePreview()">
<input id="phone" placeholder="Phone" value="+91 6371807141" oninput="updatePreview()">
<input id="address" placeholder="Address" value="Chandipur, Baleshwar, Odisha" oninput="updatePreview()">
<input id="photoUrl" placeholder="Photo URL (or leave blank)" oninput="updatePreview()">
<textarea id="profile" placeholder="Profile Summary" oninput="updatePreview()">To obtain a challenging and responsible position and serve with diligence, competence and honesty.</textarea>
</div>

<div class="section">
<h3>Skills (comma separated)</h3>
<textarea id="skills" oninput="updatePreview()">Computer Fundamentals, MS-Word, MS-Excel, MS-PowerPoint, Internet Applications, Adobe Photoshop, Tally ERP 9</textarea>
</div>

<div class="section" id="eduSection">
<h3>Education</h3>
<div id="eduList">
<div class="eduItem"><input placeholder="Degree" value="B.Com (2018-2022)"><input placeholder="College" value="DR. J N COLLEGE, RASALPUR"><input placeholder="Year/Board" value="Fakir Mohan University"></div>
</div>
<button class="add-btn" onclick="addEdu()">+ Add Education</button>
</div>

<div class="section" id="expSection">
<h3>Work Experience (Multiple)</h3>
<div id="expList">
<div class="expItem"><input placeholder="Job Title" value="Personal Assistant & Equipment Operator"><input placeholder="Company & Duration" value="VPG Group, ITR Chandipur | Jul 2023 - Present"><textarea placeholder="Description">Working as Personal Assistant and On-site Equipment Operator.</textarea></div>
</div>
<button class="add-btn" onclick="addExp()">+ Add Experience</button>
</div>

<div class="section">
<h3>Additional for Career Switcher</h3>
<textarea id="switchReason" placeholder="Why switching? Transferable Skills?" oninput="updatePreview()">Seeking to transition from finance to IT support leveraging computer skills and customer handling experience.</textarea>
</div>
</div>

<div class="right">
<div class="cv-page" id="cvPreview"></div>
</div>
</div>

<script>
let userType='fresher';
let currentTpl=1;
const colors=[ {side:'#1e3a5f', main:'#1e3a5f'}, {side:'#2e2e2e', main:'#111'}, {side:'#8e1e3c', main:'#8e1e3c'}, {side:'#0d4f4f', main:'#0d4f4f'}, {side:'#4a2c82', main:'#4a2c82'} ];

const tplGrid=document.getElementById('tplGrid');
for(let i=1;i<=100;i++){
 let div=document.createElement('div');
 div.className='tpl'+(i==1?' active':''); div.classList.add('tpl'); div.innerText=i;
 div.onclick=()=>{document.querySelectorAll('.tpl').forEach(t=>t.classList.remove('active')); div.classList.add('active'); currentTpl=i; update
